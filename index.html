<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landscaping Request Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Landscaping Request Form</h1>
        <form action="https://formsubmit.co/landscraperoc@gmail.com" method="POST">
            
            <!-- FormSubmit settings -->
            <input type="hidden" name="_subject" value="New Landscaping Request!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="text" name="_honey" style="display:none">

            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="address">Address <span class="required">*</span></label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="zip">Zip Code <span class="required">*</span></label>
                <input type="text" id="zip" name="zip" pattern="[0-9]{5}" title="Enter a 5-digit zip code" required>
            </div>

            <div class="form-group">
                <label for="workload">Describe Workload <span class="required">*</span></label>
                <textarea id="workload" name="workload" rows="5" placeholder="Describe the landscaping work you need done..." required></textarea>
            </div>

            <div class="form-group">
                <label for="comments">Additional Comments</label>
                <textarea id="comments" name="comments" rows="3" placeholder="Any other details..."></textarea>
            </div>

            <button type="submit">Submit Request</button>
        </form>
    </div>
</body>
</html>
